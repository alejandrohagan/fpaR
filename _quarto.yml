project:
  type: website
  output-dir: docs
  resources:
  - man/figures/**
  - /articles/**
  - '!/articles/*.qmd'
  - '!/articles/*.Rmd'
  - '!/articles/*.md'
  render:
  - /index.qmd
  - /reference/*.qmd
  - /articles/*.qmd
  - /articles/*.Rmd
  - /articles/*.md
  - /NEWS.md
  - '!/vignettes/'
  - '!inst/'
  - '!renv/'
  - '!packrat/'
  - '!README.qmd'
  - '!README.Rmd'
  - '!README.md'
  pre-render:
  - /usr/lib/R/bin/Rscript -e "if (requireNamespace('qrtdown', quietly = TRUE)) qrtdown::regenerate(quiet
    = TRUE) else message('qrtdown is not installed; skipping hook')"
  post-render:
  - /usr/lib/R/bin/Rscript -e "if (requireNamespace('qrtdown', quietly = TRUE)) qrtdown::postprocess_site()
    else message('qrtdown is not installed; skipping hook')"
execute:
  freeze: auto
  fig-width: 7.29
  fig-asp: 0.618
  fig-dpi: 96
website:
  title: ti
  navbar:
    title: ti 4.2.1
    left:
    - text: Get started
      href: articles/ti.qmd
    - text: Articles
      menu:
      - text: ABC Classification
        href: articles/abc.qmd
      - text: Standard vs. Non-Standard Calendars
        href: articles/calendar_types.qmd
      - text: Cohort
        href: articles/cohort.qmd
    - text: Reference
      href: reference/index.qmd
    - text: Changelog
      href: NEWS.md
    right:
    - icon: code-square
      href: https://codeberg.org/usrbinr/ti
      aria-label: Source code
  page-footer:
    left: Built with [Quarto](https://quarto.org/) and [qrtdown](https://codeberg.org/usrbinr/qrtdown)
    right: ti 4.2.1
  repo-url: https://codeberg.org/usrbinr/ti
format:
  html:
    theme:
      light: cosmo
    toc: true
    code-overflow: wrap
    css: _qrtdown-styles.css

